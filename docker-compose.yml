services:

  php:
    build: .
    ports:
      - "80:80"
    depends_on:
      - mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: business_db
    volumes:
      - mysql_data:/var/lib/mysql

volumes:

  mysql_data: